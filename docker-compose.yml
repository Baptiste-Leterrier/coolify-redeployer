services:
  redeployer:
    build: .
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Paris}
      - COOLIFY_URL=${COOLIFY_URL:-http://coolify:8080}
      - TOKEN=${TOKEN:?}
      # What to redeploy: every resource of the token's team, minus EXCLUDE (or only UUIDS if set)
      - UUIDS=${UUIDS:-}
      - EXCLUDE=${EXCLUDE:-}
      - RESOURCE_TYPES=${RESOURCE_TYPES:-application service}
      - SELF_UUID=${SELF_UUID:-}
      # When
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 0 * * *}
      # How
      - FORCE_REBUILD=${FORCE_REBUILD:-false}
      - PULL_SERVICE_IMAGES=${PULL_SERVICE_IMAGES:-true}
      - WAIT_FOR_DEPLOYMENTS=${WAIT_FOR_DEPLOYMENTS:-true}
      - DEPLOY_TIMEOUT=${DEPLOY_TIMEOUT:-1800}
      - RESOLVE_IMAGE_VERSIONS=${RESOLVE_IMAGE_VERSIONS:-true}
      - REGISTRY_CREDENTIALS=${REGISTRY_CREDENTIALS:-}
      # Manual trigger + history API (disabled while empty)
      - TRIGGER_TOKEN=${TRIGGER_TOKEN:-}
      # Logs and history
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-180}
      # Alerts (each channel is off while its variables are empty)
      - NOTIFY_ON=${NOTIFY_ON:-upgrade failure}
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_USERNAME=${NTFY_USERNAME:-}
      - NTFY_PASSWORD=${NTFY_PASSWORD:-}
      - NTFY_PRIORITY=${NTFY_PRIORITY:-}
      - NOVU_API_KEY=${NOVU_API_KEY:-}
      - NOVU_WORKFLOW_ID=${NOVU_WORKFLOW_ID:-}
      - NOVU_SUBSCRIBER_ID=${NOVU_SUBSCRIBER_ID:-}
      - NOVU_API_URL=${NOVU_API_URL:-https://api.novu.co}
    volumes:
      - redeployer-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redeployer-data:
